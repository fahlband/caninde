# Ambiente local (ADR-0003). Credenciais abaixo são apenas para desenvolvimento.
name: caninde

services:
  postgres:
    # Imagem própria (PostgreSQL 16 + PostGIS), pois a imagem postgis/postgis não tem build arm64 para a versão 16.
    build: ./infra/postgres
    environment:
      POSTGRES_DB: caninde
      POSTGRES_USER: caninde
      POSTGRES_PASSWORD: caninde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caninde -d caninde"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://caninde:caninde@postgres:5432/caninde
      # O issuer é o que o Keycloak grava no claim iss; o JWKS é buscado pela rede do Compose.
      AUTH_ISSUER_URL: http://localhost:8080/realms/caninde
      AUTH_JWKS_URL: http://keycloak:8080/realms/caninde/protocol/openid-connect/certs
      AUTH_AUDIENCE: caninde-api
    # Sem "ports": a API não é publicada, todas as chamadas passam pelo Envoy (ADR-0003).
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/caninde
      KC_DB_USERNAME: caninde
      KC_DB_PASSWORD: caninde
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - postgres

  opa:
    image: openpolicyagent/opa:1.22.3-envoy-static
    command:
      - run
      - --server
      - --addr=:8181
      - --set=plugins.envoy_ext_authz_grpc.addr=:9191
      - --set=decision_logs.console=true
      - /policies
    volumes:
      - ./infra/opa:/policies:ro

  envoy:
    image: envoyproxy/envoy:v1.39.6
    command: ["-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "8000:8000"
      - "9901:9901"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - api
      - keycloak
      - opa

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
