packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalação de dependências. Só @prisma/engines precisa rodar (baixa o
# schema engine usado pelo Prisma Migrate). Os demais vêm do Testcontainers e funcionam sem build nativo.
allowBuilds:
  "@prisma/engines": true
  prisma: false
  cpu-features: false
  protobufjs: false
  ssh2: false
