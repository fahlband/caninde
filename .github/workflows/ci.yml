# Pipeline de validação de PRs e da main (HU-01.3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O build gera dist/ do pacote shared, que a API e o front importam.
      - run: pnpm build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  politicas:
    name: Testes das políticas OPA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Executa opa test com a imagem fixada no Compose
        run: docker run --rm -v "$PWD/infra/opa:/policies:ro" openpolicyagent/opa:1.22.3 test /policies -v

  imagem:
    name: Build da imagem da API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: caninde-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
